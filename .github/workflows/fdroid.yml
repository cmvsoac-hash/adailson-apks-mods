name: Construir Repositório F-Droid

on:
  workflow_dispatch:
  push:
    paths:
      - 'fdroid/repo/**.apk'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar F-Droid Server
        run: pip install fdroidserver

      - name: Configurar Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > fdroid/fdroid.keystore
          echo "keystorepass: ${{ secrets.KEYSTORE_PASS }}" >> fdroid/config.yml
          echo "keypass: ${{ secrets.KEYSTORE_PASS }}" >> fdroid/config.yml

      - name: Atualizar Repositório
        run: |
          cd fdroid
          fdroid update --create-metadata

      - name: Salvar Alterações
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add .
          git commit -m "Atualização automática do repositório F-Droid" || echo "Nada para commitar"
          git push
